name: TraeCode Daily Check-in

on:
  schedule:
    # 每天北京时间 下午 17:30 执行（UTC 09:30）
    - cron: '30 9 * * *'
  # 支持手动触发（GitHub Actions 页面点按钮）
  workflow_dispatch:
  # 支持 API 触发（repository_dispatch，预留）
  repository_dispatch:
    types: [checkin]

jobs:
  checkin:
    runs-on: ubuntu-latest
    name: 每日签到
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run check-in
        env:
          # ===== 单账号模式（如果不用多维表格，只配 Cookie 就行） =====
          TRAE_COOKIE: ${{ secrets.TRAE_COOKIE }}
          TRAE_ACCOUNT_NAME: ${{ secrets.TRAE_ACCOUNT_NAME }}

          # ===== 多账号模式（飞书多维表格，可选） =====
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
          FEISHU_BITABLE_ACCOUNT_TABLE: ${{ secrets.FEISHU_BITABLE_ACCOUNT_TABLE }}
          FEISHU_BITABLE_LOG_TABLE: ${{ secrets.FEISHU_BITABLE_LOG_TABLE }}

          # ===== 飞书通知（可选） =====
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          # 飞书卡片上的"查看签到日志"按钮链接（你的多维表格日志表 URL）
          FEISHU_BITABLE_URL: ${{ secrets.FEISHU_BITABLE_URL }}
          # 飞书卡片上的"手动补签"按钮链接（GitHub Actions 页面 URL）
          ACTIONS_URL: ${{ secrets.ACTIONS_URL }}
        run: |
          python trae_checkin.py
        continue-on-error: false
