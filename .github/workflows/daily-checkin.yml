name: TraeCode Daily Check-in

on:
  schedule:
    # 每天北京时间 09:00 执行（UTC 01:00）
    - cron: '0 1 * * *'
  # 支持手动触发
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    name: 每日签到
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run check-in
        env:
          # ===== 单账号模式（如果不用多维表格，只配 Cookie 就行） =====
          TRAE_COOKIE: ${{ secrets.TRAE_COOKIE }}
          TRAE_ACCOUNT_NAME: ${{ secrets.TRAE_ACCOUNT_NAME }}

          # ===== 多账号模式（飞书多维表格，可选） =====
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
          FEISHU_BITABLE_ACCOUNT_TABLE: ${{ secrets.FEISHU_BITABLE_ACCOUNT_TABLE }}
          FEISHU_BITABLE_LOG_TABLE: ${{ secrets.FEISHU_BITABLE_LOG_TABLE }}

          # ===== 飞书通知（可选） =====
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          python trae_checkin.py
        continue-on-error: false
